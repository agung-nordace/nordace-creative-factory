name: Creative Sync

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger creative sync
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nordace-creative-factory.vercel.app/api/cron/creative-sync